[package]
name = "clef"
version = "0.1.0"
edition = "2021"
authors = [ "Dan Knutson <dan.knutson@gmail.com>" ]
license = "MPL-2.0"
description = "A native local music player."
repository = "https://github.com/Giesch/clef"

[dependencies]
anyhow.workspace = true
camino.workspace = true
directories.workspace = true
flume.workspace = true
log.workspace = true

pretty_env_logger = "0.5.0"

clef_shared = { path = "./crates/shared" }
clef_db = { path = "./crates/db" }
clef_audio = { path = "./crates/audio" }
clef_ui = { path = "./crates/ui" }

# compile all external dependencies in release mode
[profile.dev.package."*"]
opt-level = 3

[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/db",
    "crates/audio",
    "crates/ui"
]

[workspace.dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
camino = "1.2.6"
directories = "6.0.0"
flume = { version = "0.12.0" }
log = { version = "0.4.34", features = ["release_max_level_info"] }

thiserror = "2.0.21"
