name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux_workspace_locked:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Native Linux build prerequisites
        run: sudo apt-get update && sudo apt-get install -y pkg-config cmake libpulse-dev libfontconfig1-dev libfreetype6-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - name: dependency_targets_match_registry_snapshot and locked_resolution
        run: python scripts/check_dependencies.py
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - name: isolated_headless_harness
        run: python scripts/test_headless.py
      - run: cargo clippy --workspace --all-targets --locked

