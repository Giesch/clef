[package]
name = "clef_audio"
version = "0.1.0"
edition = "2021"
authors = [ "Dan Knutson <dan.knutson@gmail.com>" ]

[dependencies]
anyhow.workspace = true
camino.workspace = true
flume.workspace = true
log.workspace = true
thiserror.workspace = true

souvlaki = { version = "0.8.3", default-features = false, features = ["use_zbus"] }
symphonia = { version = "0.6.1", features = ["mp3"] }

clef_shared = { path = "../shared" }
clef_db = { path = "../db" }

libpulse-binding = "2.30.1"
libpulse-simple-binding = "2.29.0"

[dev-dependencies]
mockall = "0.15.0"
